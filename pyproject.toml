[project]
name = "anomaly-agent"
version = "0.1.0"
description = "MVTec anomaly detection agent extracted from evaluate_mvtec_v12."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=1.0.0",
    "langchain>=0.2.14",
    "langchain-openai>=0.1.22",
    "langchain-anthropic>=0.1.23",
    "langchain-google-genai>=3.1.0",
    "langchain-tavily>=0.1",
    "accelerate>=0.26",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tabulate>=0.9",
    "torch>=2.1",
    "tqdm>=4.66",
    "transformers>=4.50",
]

[project.optional-dependencies]
super-resolution = ["realesrgan>=0.3.0"]
dev = ["ruff>=0.6.1", "pytest>=8.3"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["react_agent", "utils"]

[tool.setuptools.package-dir]
"react_agent" = "src/react_agent"
"utils" = "utils"
